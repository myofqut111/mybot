# slam_toolbox 在线异步建图配置（豆包 × DeepSeek 融合版 2026-09-15）
# 本版在原定制版基础上，把扫描用得更勤（让激光多纠偏、少被轮子带跑）：
#   minimum_time_interval  0.5  -> 0.2   每帧扫描都参与匹配（原2~3帧才用1帧）
#   minimum_travel_distance 0.2 -> 0.15  走更短就插一个节点
#   minimum_travel_heading  0.2 -> 0.15  转更小就插一个节点，转弯更早纠偏
# 保留 transform_timeout=1.0（WiFi 抖动时多等 TF，防 scan queue is full 被丢）
# 坐标系钉死：odom/map/base_link，scan=/scan，与 EKF/URDF/固件完全一致
slam_toolbox:
  ros__parameters:
    # ---- 求解器插件（保持官方默认）----
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---- 坐标系（关键：必须和 EKF/URDF/固件完全一致）----
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping  # localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05                 # 5cm 栅格
    restamp_tf: false
    min_laser_range: 0.15             # 滤掉车身附近杂点/自反射
    max_laser_range: 8.0              # M1C1 最大量程 8m；与 AMCL laser_max_range 一致
    minimum_time_interval: 0.2        # 【改 0.5->0.2】每帧都参与匹配
    transform_timeout: 1.0            # WiFi 抖动时多等 TF，防 queue is full
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # ---- 通用匹配参数 ----
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.15     # 【改 0.2->0.15】节点更密、段间漂移更小
    minimum_travel_heading: 0.15      # 【改 0.2->0.15】转弯更早纠偏
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 6.0
    do_loop_closing: true             # 开启回环闭合
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---- 局部相关匹配：扩大搜索，容忍 odom 先验误差 ----
    correlation_search_space_dimension: 1.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1  # 硬区间[0.005,0.1]，不可超0.1

    # ---- 回环搜索空间 ----
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---- 匹配惩罚：调小 = 更相信激光匹配、少被 odom 带跑 ----
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.5
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
