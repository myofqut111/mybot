# 自主探索参数。
# 看图模式只要 min_size / unknown_radius_m / max_candidates / 两个权重；
# 开车模式还会用到下面那些以 _m / _s 结尾的。

explore_node:
  ros__parameters:
    # ---- 看图 ----
    map_topic: /map
    base_frame: base_link
    period_s: 1.0
    min_size: 4              # 前沿簇小于这么多个格子就丢掉（滤掉碎点）
    unknown_radius_m: 1.0    # 算"去了能看见多少未知"的半径
    max_candidates: 20
    min_separation_m: 1.0    # 两个候选至少隔这么远，否则只留分数高的
    goal_clearance_m: 0.35   # 目标点离墙至少这么远（前沿天生贴边，太近 nav2 会拒）

    # ---- 擦图（用激光把未知变空闲，让边界往里退）----
    # 关掉它就只会走到已知边界为止，进不去未知区
    carve_enabled: true
    carve_max_range_m: 4.0   # 只信这么远以内的光束（远处噪声大）
    carve_robot_radius_m: 0.25
    carve_period_s: 0.5      # 最快多久擦一次
    w_distance: 0.6          # 打分权重：近的优先
    w_gain: 0.4              # 打分权重：能看见大片的优先

    # ---- 开车 ----
    drive: false             # true 才会真的发 NavigateToPose
    autostart: false         # true 时一起就开跑（否则等 /explore/start 服务）
    nav_action: navigate_to_pose
    nav_server_wait_s: 5.0   # 等 Action server 的时长；连上之后不再重复等
    visited_radius_m: 1.2    # 走过一个点，周围这么大蛋糕算"看过"
    min_goal_distance_m: 0.8 # 太近的点不去，免得原地打转
    max_goal_distance_m: 15.0
    nav_timeout_s: 90.0      # 单个目标最多给这么久
    settle_s: 1.0            # 到点后等多久再重新算前沿
    stuck_window_s: 10.0     # 这么久没挪窝就算卡住
    stuck_move_m: 0.05
    max_consecutive_failures: 3
    max_duration_s: 1200.0   # 整场探索最多 20 分钟
    return_home: true        # 探完回起点
