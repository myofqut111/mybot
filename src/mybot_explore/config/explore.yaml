# 自主探索参数。
# 看图模式只要 min_size / unknown_radius_m / max_candidates / 两个权重；
# 开车模式还会用到下面那些以 _m / _s 结尾的。

explore_node:
  ros__parameters:
    # ---- 看图 ----
    map_topic: /map
    base_frame: base_link
    period_s: 1.0
    min_size: 4              # 前沿簇小于这么多个格子就丢掉（滤掉碎点）
    unknown_radius_m: 1.0    # 算"去了能看见多少未知"的半径
    max_candidates: 20
    min_separation_m: 1.0    # 两个候选至少隔这么远，否则只留分数高的
    # 可达性：激光能从凳子腿之间穿过去，车过不去。
    # traversable_clearance_m 是"车半径 + 余量"，小于它的格子一律当不可通行；
    # 再从车位做连通性 BFS，走不到的前沿直接丢掉。
    traversable_clearance_m: 0.30
    reach_search_m: 0.6          # 候选点附近这么近有可达格子就算数
    # 封缝：把腿与腿之间的细缝算成障碍（2D 激光看不见椅子面）。
    # 代价是真窄门也会被封，窄门多的场地可以关掉。
    seal_gaps: true
    seal_radius_m: 0.25
    # 临近目标的豁免窗口：最后 0.5 m 不判卡住，但最多豁免这么久
    near_goal_timeout_s: 15.0
    goal_clearance_m: 0.35   # 目标点离墙至少这么远（前沿天生贴边，太近 nav2 会拒）

    # ---- 擦图（用激光把未知变空闲，让边界往里退）----
    # 关掉它就只会走到已知边界为止，进不去未知区
    carve_enabled: true
    carve_max_range_m: 4.0   # 只信这么远以内的光束（远处噪声大）
    carve_robot_radius_m: 0.25
    carve_period_s: 0.5      # 最快多久擦一次
    w_distance: 0.6          # 打分权重：近的优先
    w_gain: 0.4              # 打分权重：能看见大片的优先

    # ---- 开车 ----
    # 收工自动存图（B2）：slam 模式走 /slam_toolbox/save_map，
# amcl 模式没有这个服务，自动退回 map_saver_cli
    # ---- 收工（B1/B2/B3）----
    # 没有候选时先观察这么久：期间未知格子还在变少就说明只是暂时没前沿
    no_frontier_grace_s: 30.0
    unknown_drop_cells: 20   # 未知格子少掉这么多就重置上面的计时
    # 收工自动存图：slam 模式走 /slam_toolbox/save_map，
    # amcl 模式没有这个服务，自动退回 map_saver_cli
    auto_save: true
    save_map_dir: "~/maps"
    save_map_prefix: "explore"
    save_map_service: "/slam_toolbox/save_map"
    # 存完再做一次 3x3 中值去毛刺，另存 *_clean.pgm
    map_despike: true
    # ---- 开车 ----
    drive: false             # true 才会真的发 NavigateToPose
    autostart: false         # true 时一起就开跑（否则等 /explore/start 服务）
    nav_action: navigate_to_pose
    nav_server_wait_s: 5.0   # 等 Action server 的时长；连上之后不再重复等
    visited_radius_m: 1.2    # 走过一个点，周围这么大蛋糕算"看过"
    min_goal_distance_m: 0.8 # 太近的点不去，免得原地打转
    max_goal_distance_m: 15.0
    nav_timeout_s: 90.0      # 单个目标最多给这么久
    settle_s: 0.3            # 到点后等多久再重新算前沿（1.0->0.3，别白站着）
    stuck_window_s: 15.0
    # nav2 突然不吭声（不发 cmd_vel 也不报错）多久就放弃这个点
    nav_silence_s: 3.0
    nav_silence_linear: 0.02
    nav_silence_angular: 0.05     # 这么久没"进展"就算卡住（2026-11-15：10->15，窄处转弯本来就慢）
    stuck_move_m: 0.08       # 位移超过它算进展
    stuck_move_rad: 0.30     # 转角超过它也算进展（原地对准不是卡住；0.15->0.30 少误判）
    retarget_cooldown_s: 3.0 # 放弃目标后冷几秒再选下一个，否则车会原地又转一次
    final_approach_m: 0.5    # 离目标这么近就不判卡住（最后对准本来就慢）
    blacklist_radius_m: 1.5  # 拉黑半径；到过的点也算，否则会挪 20 cm 再转一圈
    max_consecutive_failures: 10   # 只统计真的失败（abort/超时）；stuck 不算
    max_stuck_streak: 5      # 仅作诊断计数，不会因此收工
    max_blacklist: 60        # 拉黑的点数到上限才算"到处都试过了"，才收工

    # ---- 打滑 / 低矮障碍（2026-11-16）----
    # 判据 A：map→odom 在长（SLAM 说没动、odom 说在走）；
    # 判据 B：近场扫描没变而 odom 在涨。A 且 B 才判打滑。
    slip_enabled: true
    slip_check_period_s: 0.5
    slip_window_s: 3.0
    slip_odom_min_m: 0.05        # 一拍(0.5s)里 odom 走这么多才算在动（≈0.1 m/s 下限）
    slip_map_odom_min_m: 0.08    # map→odom 漂移超过它 = odom 在说假话
    slip_scan_change_ratio: 0.15 # 变化束占比低于它 = 扫描认为车没动
    slip_scan_diff_m: 0.03       # 差值超过它才算"这束变了"
    slip_scan_near_m: 3.0        # 只信这么近的束
    slip_max_omega: 0.30         # 角速度超过它不判（原地转是正常的）
    slip_min_valid_ratio: 0.40   # 仅供诊断
    slip_min_hits: 20            # 近场命中束少于它就不判（空旷区没有可比性）
    slip_min_speed: 0.05         # 命令速度≈0 不判
    slip_confirm_s: 1.5          # 持续这么久才确认
    slip_hold_timeout_s: 10.0

    # ---- 推台阶 / 顶矮墙：只有"扫描没变但 odom 在涨"这一条（不靠 map→odom）----
    # 打滑和顶住长得几乎一样，区别在于：打滑时 slam 会去修正 map→odom（A 成立），
    # 推台阶时车在世界里真没动、slam 无从修正（A 恒为 0）。所以这条只靠 B。
    blocked_enabled: true
    block_window_s: 3.0
    block_odom_min_m: 0.30
    block_scan_change_ratio: 0.10
    block_scan_near_m: 1.0
    block_scan_diff_m: 0.03
    block_min_hits: 8
    block_min_speed: 0.05
    block_max_omega: 0.20
    block_confirm_s: 1.0
    block_cooldown_s: 5.0
    # 转不动（原地顶住）：|w| 够大、odom 的 yaw 变了、扫描却没变
    block_turn_min_omega: 0.15
    block_turn_min_rad: 0.20
    # 低台阶激光看不见：近场命中太少时自动把半径放大（1→2→4 m）
    block_near_expand: true
    slip_debug: false    # 打滑后等它真动起来的上限
    # 挡住点：只画有物证的那 0.5 m 短墙；其余保持未知
    blocked_wall_enabled: true
    blocked_wall_offset_m: 0.22  # 车头前沿离车身中心的距离
    blocked_wall_len_m: 0.50     # 车宽 0.3 + 两侧各 0.1 余量
    keepout_radius_m: 1.00       # 禁试区：只影响选点，不写进地图
    blocked_persist_hits: 2      # 同一片打滑几次算"真挡住"
    blocked_file: "~/.ros/mybot_blocked.json"
    look_around: true        # 到点转一圈，让同一片区域被多角度看到
    look_around_yaw: 6.283   # 一圈；会按 ≤180° 拆成多次绝对转向
    look_around_speed: 2.0   # 名义角速度；1.2->2.0，一圈从 5.2 s 降到 3.1 s
    look_around_timeout_s: 30.0
    max_duration_s: 1200.0   # 整场探索最多 20 分钟
    return_home: true        # 探完回起点
    scan_gate_enabled: true
    scan_gate_topic: /explore/scan_gate
    home_settle_s: 3.0
    home_timeout_s: 120.0
