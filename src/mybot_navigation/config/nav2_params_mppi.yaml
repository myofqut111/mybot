# =============================================================================
# Nav2 参数 —— 稳定版 + 避障修正版 v4（2026-09-16，完全照搬官方 costmap 配置）
#
# 定位（AMCL/EKF）保持真机验证过的 stable 调校，一字未动。
#
# 本版 costmap 完全参考 Nav2 官方 turtlebot3 nav2_params.yaml：
#   - 去掉 qos: "sensor_data"（雷达是 RELIABLE，默认订阅即匹配，勿画蛇添足）
#   - 去掉 inf_is_valid（默认 False）
#   - scan 源显式 max_obstacle_height: 2.0
#   - local 用 VoxelLayer、global 用 ObstacleLayer（官方标准组合）
#   - obstacle_max_range 2.5 / raytrace 3.0 / inflation 0.55 / width 3
# =============================================================================

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.0
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 300
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fall_off: 0.0
    recovery_alpha_slow: 0.0005
    recovery_alpha_fast: 0.02
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # 过大的未来 TF 预测会让 costmap 在启动和重定位时产生 extrapolation。
    transform_tolerance: 0.2
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    scan_topic: "/scan"
    set_initial_pose: false
    always_reset_initial_pose: false
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "/odometry/filtered"
    bt_loop_duration: 200
    default_server_timeout: 30

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_rate: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 25.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: True
    FollowPath:
      # 与 nav2_params.yaml 的差别只在这一段：RPP -> MPPI。
      # 选哪个由 launch 参数 controller:=rpp|mppi 决定（默认 rpp）。
      plugin: "nav2_mppi_controller::MPPIController"

      # --- 预测与采样 ---
      time_steps: 40                 # 40 x 0.05 = 2.0 s 预测视野
      model_dt: 0.05
      batch_size: 600                # 默认 1000；先用 600，CPU 富余再加
      iteration_count: 1

      # --- 运动学约束（跟 RPP 对齐：0.18 m/s、不横移、不倒车）---
      motion_model: "DiffDrive"
      vx_max: 0.18
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.0
      vx_std: 0.10
      vy_std: 0.0
      wz_std: 0.30
      temperature: 0.3
      gamma: 0.015
      prune_distance: 0.4
      transform_tolerance: 0.2

      # --- 性能相关：RViz 里画采样轨迹很吃 CPU，关掉 ---
      visualize: false
      regenerate_noises: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # --- critics：Humble 官方默认组合与权重 ---
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true   # 用真实 0.40x0.30 矩形判碰撞，不用内切圆
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

behavior_server:
  ros__parameters:
    costmap_topic: "/local_costmap/costmap_raw"
    footprint_topic: "/local_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "odom"
    robot_base_frame: "base_link"
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    acc_lim_trans: 0.25
    local_frame: "odom"

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: false
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "odom"
      robot_base_frame: "base_link"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 用真实外形代替圆形近似：圆能过的缝，长方形车身不一定能过。
      # 尺寸按 40 x 30 cm 取（含轮子），车不一样就改这四个点。
      footprint: "[[-0.20, -0.15], [0.20, -0.15], [0.20, 0.15], [-0.20, 0.15]]"
      footprint_padding: 0.03
      transform_tolerance: 1.0
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # RViz 不需要体素可视化；关闭可减少长期 GPU/网络负载。
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      # 只发布变化区域，避免 RViz 长时间接收完整 costmap。
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_link"
      # 用真实外形代替圆形近似：圆能过的缝，长方形车身不一定能过。
      # 尺寸按 40 x 30 cm 取（含轮子），车不一样就改这四个点。
      footprint: "[[-0.20, -0.15], [0.20, -0.15], [0.20, 0.15], [-0.20, 0.15]]"
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 1.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      # 只发布变化区域，避免 RViz 长时间接收完整 costmap。
      always_send_full_costmap: False

map_server:
  ros__parameters:
    yaml_filename: ""   # 由 launch 用 RewrittenYaml 注入真实地图路径
